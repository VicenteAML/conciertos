<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartelera | ConciertosYa</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="icon" type="image/png" href="img/logo.png">
</head>
<body>
  <!-- Menú común a todas las páginas -->
  <header class="encabezado">
    <a class="logo" href="index.html"><img src="img/logo.svg" alt="Onda de sonido"> ConciertosYa</a>
    <nav>
      <a href="index.html" class="activo">Cartelera</a>
      <a href="mis-inscripciones.html">Mis inscripciones</a>
    </nav>

  <main class="contenedor">
    <h1>Cartelera de conciertos</h1>

    <input id="buscador" class="buscador" type="text" placeholder="Buscar por artista o lugar...">

    <!-- Aquí cartelera.js dibuja las tarjetas de conciertos -->
    <section id="lista-conciertos" class="grilla">

  <footer class="pie">Proyecto Arquitectura de Sistemas · Inscripción a eventos</footer>

  <script src="js/comun.js"></script>
